<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardAlive — Bring your cards to life</title>
  <meta name="description" content="CardAlive brings trading cards to life. Join the waitlist." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="CardAlive — Bring your cards to life" />
  <meta property="og:description" content="We bring trading cards to life. Join the waitlist." />
  <meta property="og:image" content="./assets/img/logo.png" />
  <meta name="theme-color" content="#050608" />

  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <div class="bg-glow bg-glow--teal" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--gold" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="stage">
    <!-- LOGO -->
    <img class="logo" src="./assets/img/logo.png" alt="CardAlive" width="1704" height="923" />

    <!-- QUOTE -->
    <p class="tagline">Bring your cards to life</p>

    <!-- VIDEOS -->
    <div class="videos">
      <figure class="vid">
        <div class="vid__frame" role="img" aria-label="Video placeholder: where we started">
          <span class="vid__play">▶</span>
          <span class="vid__soon">Video coming soon</span>
        </div>
        <figcaption class="vid__cap">Where we started</figcaption>
      </figure>

      <figure class="vid">
        <div class="vid__frame" role="img" aria-label="Video placeholder: where we are now">
          <span class="vid__play">▶</span>
          <span class="vid__soon">Video coming soon</span>
        </div>
        <figcaption class="vid__cap">Where we are now</figcaption>
      </figure>
    </div>

    <!-- WAITLIST -->
    <div class="cta" id="cta">
      <button type="button" class="btn" id="join-btn">
        Join the Waitlist <span class="btn__arrow">→</span>
      </button>

      <form id="waitlist-form" class="wl-form" novalidate hidden>
        <!-- Web3Forms: replace with your key from https://web3forms.com -->
        <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY" />
        <input type="hidden" name="subject" value="New CardAlive waitlist signup" />
        <input type="hidden" name="from_name" value="CardAlive Waitlist" />
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <div class="wl-form__row">
          <input type="email" name="email" id="wl-email" class="wl-form__input"
                 placeholder="you@email.com" autocomplete="email" required />
          <button type="submit" class="btn wl-form__btn">
            <span class="wl-form__btn-label">Join</span>
          </button>
        </div>
      </form>

      <p class="wl-msg" id="wl-msg" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script src="./assets/js/main.js" defer></script>
</body>
</html>
