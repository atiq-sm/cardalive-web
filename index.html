<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardAlive — Bring your cards to life</title>
  <meta name="description" content="CardAlive brings trading cards to life. Join the waitlist." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="CardAlive — Bring your cards to life" />
  <meta property="og:description" content="We bring trading cards to life. Join the waitlist." />
  <meta property="og:image" content="./assets/img/logo.png" />
  <meta name="theme-color" content="#050608" />

  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <div class="bg-glow bg-glow--teal" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--gold" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="stage">
    <!-- LOGO -->
    <img class="logo" src="./assets/img/logo.png" alt="CardAlive" width="1704" height="923" />

    <!-- QUOTE -->
    <p class="tagline">Bring your cards to life</p>

    <!-- VIDEOS -->
    <div class="videos">
      <figure class="vid">
        <div class="vid__frame vid__frame--filled">
          <video class="vid__video" controls playsinline preload="metadata"
                 poster="./assets/video/where-we-started.jpg"
                 aria-label="Where we started: QR card detection in the Unity editor">
            <source src="./assets/video/where-we-started.mp4" type="video/mp4" />
          </video>
        </div>
        <figcaption class="vid__cap">
          Where we started
          <span class="vid__date">July 2026</span>
        </figcaption>
      </figure>

      <figure class="vid">
        <div class="vid__frame vid__frame--filled">
          <video class="vid__video" controls playsinline preload="metadata"
                 poster="./assets/video/where-we-are-now.jpg"
                 aria-label="Where we are now: creatures summoned onto a real table on Quest 3">
            <source src="./assets/video/where-we-are-now.mp4" type="video/mp4" />
          </video>
        </div>
        <figcaption class="vid__cap">Where we are now</figcaption>
      </figure>
    </div>

    <!-- WAITLIST -->
    <div class="cta" id="cta">
      <!-- Signups are collected by a Google Form, so there is no inline email field
           and no form backend to key. -->
      <a class="btn" href="https://forms.gle/tzt7sP8B76FTRjBf7"
         target="_blank" rel="noopener noreferrer">
        Join the Waitlist <span class="btn__arrow">→</span>
      </a>
    </div>
  </main>

  <script src="./assets/js/main.js" defer></script>
</body>
</html>
